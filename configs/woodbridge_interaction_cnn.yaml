# Frozen configuration: interaction_cnn on the woodbridge benchmark ('nocom' in the code).
# Best five-epoch screening trial of the paper (validation ROC-AUC 0.996273).
# max_epochs and early_stopping_patience are set to the final-training protocol (25 epochs,
# no early stopping). run_one.py overrides seed, and slice_width/stride for the sweep.
activation: relu
architecture: interaction_cnn
background: black
batch_size: 64
conv_kernel_size: 3
conv_layers: 2
dataset: nocom
dropout: 0.0
early_stopping_min_delta: 0.0001
early_stopping_patience: 25
embedding_dim: 128
font: DejaVu Sans
image_height: 32
interaction_activation: gelu
interaction_channels: rich
interaction_classifier: mlp
interaction_classifier_hidden: 32
interaction_conv_layers: 3
interaction_hidden_channels: 32
interaction_kernel_size: 5
interaction_normalization: masked_groupnorm_1group
interaction_pooling: mean
learning_rate: 0.00022210177375517361
max_epochs: 25
num_workers: 4
pair_symmetry: average_interaction_map_and_transpose_logits
pooling: mean
processor: conv1d
remove_padding: true
seed: 7
sequence_reduction: mean
slice_width: 16
stride: 8
stride_mode: half_overlap
weight_decay: 1.0e-06
source:
  repository: github.com/setliu22/Itau
  commit: 4f93925
  study: nocom_interaction_cnn
  trial: 2
  screening_validation_roc_auc: 0.9962734191771828
  paper_trainable_parameters: 301793
