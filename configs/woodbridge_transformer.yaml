# Frozen configuration: transformer on the woodbridge benchmark ('nocom' in the code).
# Best five-epoch screening trial of the paper (validation ROC-AUC 0.994443).
# max_epochs and early_stopping_patience are set to the final-training protocol (25 epochs,
# no early stopping). run_one.py overrides seed, and slice_width/stride for the sweep.
activation: relu
architecture: transformer
background: black
batch_size: 64
conv_kernel_size: 3
conv_layers: 2
dataset: nocom
dropout: 0.0
early_stopping_min_delta: 0.0001
early_stopping_patience: 25
embedding_dim: 128
final_activation: relu
final_head: symmetric_mlp
final_hidden_dim: 64
final_hidden_ratio: 0.5
font: DejaVu Sans
image_height: 32
learning_rate: 0.00026620890669660683
max_epochs: 25
num_workers: 4
pair_symmetry: shared_encoder_plus_symmetric_final_features
pooling: mean
positional_encoding: rope
processor: transformer
remove_padding: false
seed: 7
sequence_reduction: mean
slice_width: 16
stride: 8
stride_mode: half_overlap
transformer_activation: relu
transformer_ffn_dim: 256
transformer_ffn_ratio: 2
transformer_heads: 4
transformer_layers: 2
weight_decay: 0.0
source:
  repository: github.com/setliu22/Itau
  commit: 4f93925
  study: nocom_transformer_max2
  trial: 4
