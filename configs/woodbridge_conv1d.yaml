# Frozen configuration: conv1d on the woodbridge benchmark ('nocom' in the code).
# Best five-epoch screening trial of the paper (validation ROC-AUC 0.977430).
# max_epochs and early_stopping_patience are set to the final-training protocol (25 epochs,
# no early stopping). run_one.py overrides seed, and slice_width/stride for the sweep.
activation: relu
architecture: conv1d
background: black
batch_size: 64
conv_kernel_size: 3
conv_layers: 2
dataset: nocom
dropout: 0.0
early_stopping_min_delta: 0.0001
early_stopping_patience: 25
embedding_dim: 128
final_activation: relu
final_head: cosine_linear
final_hidden_dim: 128
final_hidden_ratio: null
font: DejaVu Sans
image_height: 32
learning_rate: 0.001
max_epochs: 25
num_workers: 4
pair_symmetry: shared_encoder_plus_symmetric_final_features
pooling: mean
processor: conv1d
remove_padding: false
seed: 7
sequence_reduction: mean
slice_width: 6
stride: 6
stride_mode: nonoverlap
weight_decay: 0.0
source:
  repository: github.com/setliu22/Itau
  commit: 4f93925
  study: nocom_conv1d
  trial: 0
  screening_validation_roc_auc: 0.9774303098248558
